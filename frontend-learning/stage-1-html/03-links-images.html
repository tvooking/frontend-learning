<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>第3课：链接与图片</title>
</head>
<body>

  <h1>🔗 链接 & 🖼️ 图片</h1>

  <h2>链接 &lt;a&gt;</h2>
  <p>
    <!-- href 是链接地址，target="_blank" 在新标签页打开 -->
    访问 <a href="https://www.bing.com" target="_blank">Bing 搜索</a>
  </p>
  <p>
    <a href="01-first-page.html">👉 点击跳转到第1课</a>
  </p>

  <h2>图片 &lt;img&gt;</h2>
  <p>网络图片：</p>
  <img src="https://via.placeholder.com/300x200/3498db/ffffff?text=示例图片" alt="示例图片" width="300">

  <p>本地图片（假如你有图片文件）：</p>
  <p><code>&lt;img src="photo.jpg" alt="我的照片" width="200"&gt;</code></p>

  <h2>图片也可以作为链接</h2>
  <a href="https://www.bing.com" target="_blank">
    <img src="https://via.placeholder.com/150/2ecc71/ffffff?text=点我" alt="点击去Bing">
  </a>

  <hr>

  <h2>📌 要点总结</h2>
  <ul>
    <li>href 属性指定跳转地址</li>
    <li>target="_blank" 新窗口打开</li>
    <li>src 属性指定图片路径</li>
    <li>alt 属性是图片描述（无法加载时显示）</li>
    <li>width / height 控制尺寸</li>
  </ul>

  <hr>

  <h2>✏️ 动手试试</h2>
  <p>把链接改成你常去的网站，图片换成你喜欢的图片地址。</p>
</body>
</html>
