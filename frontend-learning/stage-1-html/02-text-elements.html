<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>第2课：文本与常用标签</title>
</head>
<body>

  <h1>📝 文本标签大全</h1>

  <h2>标题从 h1 到 h6</h2>
  <h1>h1 一级标题</h1>
  <h2>h2 二级标题</h2>
  <h3>h3 三级标题</h3>
  <h4>h4 四级标题</h4>
  <h5>h5 五级标题</h5>
  <h6>h6 六级标题</h6>

  <h2>段落与文字样式</h2>
  <p>这是一个普通段落。</p>
  <p>这是 <b>加粗</b>、<i>斜体</i>、<u>下划线</u>、<s>删除线</s> 的效果。</p>
  <p><strong>strong</strong> 也表示加粗（语义更强），<em>em</em> 也表示斜体。</p>

  <h2>特殊元素</h2>
  <p>
    换行标签：第一行<br>
    这是第二行
  </p>
  <p>分割线：</p>
  <hr>
  <p>分割线上面有一条线</p>

  <p>
    <small>小号文字</small>，
    <mark>高亮文字</mark>，
    <del>已删除</del>，
    <ins>插入文字</ins>
  </p>

  <hr>

  <h2>✏️ 动手试试</h2>
  <p>写一段自我介绍，用上 <b>加粗</b>、<i>斜体</i> 和 <mark>高亮</mark>。</p>
</body>
</html>
