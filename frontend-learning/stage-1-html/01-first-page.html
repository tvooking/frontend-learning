<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>第1课：我的第一个网页</title>
</head>
<body>
  <!-- 这是注释，不会被显示 -->

  <h1>你好，世界！🌍</h1>
  <p>这是我的第一个网页。</p>
  <p>前端开发由三部分组成：</p>

  <!-- 这是一个无序列表 -->
  <ul>
    <li>HTML - 结构</li>
    <li>CSS - 样式</li>
    <li>JavaScript - 行为</li>
  </ul>

  <hr>

  <h2>📌 本节课要点</h2>
  <ol>
    <li>&lt;!DOCTYPE html&gt; 声明文档类型</li>
    <li>&lt;html&gt; 是根元素</li>
    <li>&lt;head&gt; 放配置信息（标题、编码等）</li>
    <li>&lt;body&gt; 放页面内容</li>
    <li>&lt;h1&gt;~&lt;h6&gt; 标题标签</li>
    <li>&lt;p&gt; 段落标签</li>
    <li>&lt;ul&gt; / &lt;ol&gt; 列表标签</li>
  </ol>

  <hr>

  <h2>✏️ 动手试试</h2>
  <p>把上面的 "你好，世界！" 改成你的名字，刷新浏览器看看变化！</p>
</body>
</html>
