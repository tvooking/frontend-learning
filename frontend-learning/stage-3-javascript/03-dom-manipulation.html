<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>第3课：DOM 操作</title>
  <style>
    body {
      font-family: "Microsoft YaHei", sans-serif;
      background: #2c3e50;
      color: #ecf0f1;
      padding: 20px;
      line-height: 1.8;
    }
    h1 { text-align: center; color: #e74c3c; }
    .card {
      background: #34495e;
      border-radius: 10px;
      padding: 20px;
      margin: 15px 0;
    }
    .card h2 { color: #f39c12; margin-top: 0; }
    button {
      background: #3498db;
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      margin: 3px;
    }
    button:hover { background: #2980b9; }
    button.danger { background: #e74c3c; }
    button.danger:hover { background: #c0392b; }
    button.success { background: #2ecc71; }
    button.success:hover { background: #27ae60; }
    input {
      padding: 8px 12px;
      border: none;
      border-radius: 5px;
      font-size: 14px;
    }
    .box {
      background: #e74c3c;
      width: 100px;
      height: 100px;
      border-radius: 8px;
      margin: 10px 0;
      transition: all 0.3s;
    }
    #todo-list li {
      padding: 8px;
      margin: 5px 0;
      background: #2c3e50;
      border-radius: 5px;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #todo-list li .delete-btn {
      background: #e74c3c;
      padding: 2px 10px;
      font-size: 12px;
    }
    pre code {
      color: #2ecc71;
    }
  </style>
</head>
<body>

  <h1>🏗️ DOM 操作</h1>

  <p style="text-align:center;">DOM = Document Object Model（文档对象模型），就是通过 JS 操作 HTML 元素。</p>

  <!-- ===== 1. 修改内容 ===== -->
  <div class="card">
    <h2>① 修改内容和样式</h2>
    <p id="text-target">这段文字可以被修改。</p>
    <button onclick="changeText()">修改文字</button>
    <button onclick="changeColor()">改颜色</button>
    <button onclick="toggleSize()">切换大小</button>
    <button class="danger" onclick="hideText()">隐藏/显示</button>
  </div>

  <!-- ===== 2. 添加/删除元素 ===== -->
  <div class="card">
    <h2>② 添加 / 删除元素</h2>
    <div id="box-container">
      <div class="box"></div>
    </div>
    <button onclick="addBox()">➕ 添加方块</button>
    <button class="danger" onclick="removeBox()">➖ 删除方块</button>
  </div>

  <!-- ===== 3. 待办清单 ===== -->
  <div class="card">
    <h2>③ 📋 待办清单</h2>
    <div style="display:flex; gap:10px; margin-bottom:10px;">
      <input type="text" id="todo-input" placeholder="输入待办事项..." style="flex:1;">
      <button onclick="addTodo()">添加</button>
    </div>
    <ul id="todo-list">
      <li>
        学习 HTML
        <button class="delete-btn danger" onclick="this.parentElement.remove()">删除</button>
      </li>
      <li>
        学习 CSS
        <button class="delete-btn danger" onclick="this.parentElement.remove()">删除</button>
      </li>
      <li>
        学习 JavaScript
        <button class="delete-btn danger" onclick="this.parentElement.remove()">删除</button>
      </li>
    </ul>
  </div>

  <!-- ===== 4. classList 操作 ===== -->
  <div class="card">
    <h2>④ classList 操作</h2>
    <style>
      .highlight-box {
        background: #f39c12;
        color: #2c3e50;
        padding: 20px;
        border-radius: 8px;
        font-weight: bold;
      }
      .big-box {
        transform: scale(1.2);
        margin: 20px 0;
      }
      .rounded-box {
        border-radius: 50px;
      }
    </style>
    <div id="class-demo" style="background:#1abc9c; padding:20px; border-radius:8px; text-align:center; transition:0.3s;">
      操作我的 class
    </div>
    <br>
    <button onclick="toggleHighlight()">切换高亮</button>
    <button onclick="toggleRounded()">切换圆角</button>
  </div>

  <script>
    // ====== 1. 修改内容和样式 ======
    function changeText() {
      let el = document.getElementById("text-target");
      el.textContent = "内容已修改！✅ 这是通过 JS 改的。";
    }

    function changeColor() {
      let el = document.getElementById("text-target");
      el.style.color = el.style.color === "red" ? "#ecf0f1" : "red";
      el.style.fontWeight = "bold";
    }

    let isBig = false;
    function toggleSize() {
      let el = document.getElementById("text-target");
      isBig = !isBig;
      el.style.fontSize = isBig ? "24px" : "16px";
    }

    function hideText() {
      let el = document.getElementById("text-target");
      el.style.display = el.style.display === "none" ? "block" : "none";
    }

    // ====== 2. 添加/删除元素 ======
    let boxCount = 1;

    function addBox() {
      let container = document.getElementById("box-container");
      let newBox = document.createElement("div");
      newBox.className = "box";
      // 随机颜色
      let colors = ["#e74c3c", "#3498db", "#2ecc71", "#f39c12", "#9b59b6", "#1abc9c"];
      newBox.style.background = colors[boxCount % colors.length];
      container.appendChild(newBox);
      boxCount++;
    }

    function removeBox() {
      let container = document.getElementById("box-container");
      if (container.children.length > 0) {
        container.removeChild(container.lastElementChild);
        boxCount--;
      }
    }

    // ====== 3. 待办清单 ======
    function addTodo() {
      let input = document.getElementById("todo-input");
      let text = input.value.trim();
      if (text === "") {
        alert("请输入待办事项！");
        return;
      }

      let list = document.getElementById("todo-list");
      let li = document.createElement("li");
      li.textContent = text;

      let delBtn = document.createElement("button");
      delBtn.textContent = "删除";
      delBtn.className = "delete-btn danger";
      delBtn.onclick = function() {
        li.remove();
      };

      li.appendChild(delBtn);
      list.appendChild(li);
      input.value = "";
    }

    // ====== 4. classList 操作 ======
    function toggleHighlight() {
      let el = document.getElementById("class-demo");
      el.classList.toggle("highlight-box");
    }

    function toggleRounded() {
      let el = document.getElementById("class-demo");
      el.classList.toggle("rounded-box");
    }
  </script>

  <hr>

  <h2 style="text-align:center;">✏️ 动手试试</h2>
  <p style="text-align:center;">1. 给待办清单添加"已完成"功能（点击事项文字切换样式）<br>
     2. 添加一个"全部清空"按钮</p>
</body>
</html>
