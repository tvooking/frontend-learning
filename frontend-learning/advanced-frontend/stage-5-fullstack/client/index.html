<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全栈待办清单</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      min-height: 100vh; color: #eee; padding: 20px;
    }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { text-align: center; color: #e94560; margin-bottom: 30px; }

    .card {
      background: #16213e; border-radius: 12px; padding: 25px;
      margin-bottom: 20px; border: 1px solid #333;
    }

    /* 连接状态 */
    .status-bar {
      display: flex; align-items: center; gap: 8px; justify-content: center;
      padding: 10px; border-radius: 8px; margin-bottom: 20px;
    }
    .status-dot {
      width: 10px; height: 10px; border-radius: 50%;
    }
    .status-dot.connected { background: #2ecc71; }
    .status-dot.disconnected { background: #e74c3c; }

    /* 输入区 */
    .input-group { display: flex; gap: 10px; }
    .input-group input {
      flex: 1; padding: 12px; border: 2px solid #333;
      border-radius: 8px; background: #1a1a2e; color: #eee;
      font-size: 15px;
    }
    .input-group input:focus { border-color: #e94560; outline: none; }

    .btn {
      padding: 12px 24px; border: none; border-radius: 8px;
      cursor: pointer; font-size: 14px; font-weight: bold;
    }
    .btn-primary { background: #e94560; color: white; }
    .btn-primary:hover { background: #c73652; }
    .btn-danger { background: #e74c3c; color: white; padding: 6px 12px; font-size: 12px; }

    /* 待办列表 */
    #todo-list { list-style: none; }
    .todo-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 15px; background: #1a1a2e;
      border-radius: 8px; margin-bottom: 8px;
      transition: transform 0.2s;
    }
    .todo-item:hover { transform: translateX(5px); }
    .todo-item.done { opacity: 0.6; }
    .todo-item.done .todo-text {
      text-decoration: line-through; color: #888;
    }
    .todo-text { flex: 1; word-break: break-all; }
    .todo-check { width: 20px; height: 20px; cursor: pointer; }

    /* 统计 */
    .stats {
      display: flex; justify-content: space-around; padding: 10px 0;
    }
    .stats div { text-align: center; }
    .stats .num { font-size: 24px; font-weight: bold; color: #e94560; }
    .stats .label { font-size: 12px; color: #888; }

    .loading { text-align: center; padding: 30px; color: #888; }

    .api-info {
      background: #0f3460; border-radius: 8px; padding: 15px;
      font-family: monospace; font-size: 13px; color: #53d769;
      line-height: 2;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📋 全栈待办清单</h1>

    <!-- 连接状态 -->
    <div class="status-bar" id="status-bar">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">检查连接中...</span>
    </div>

    <!-- 添加 -->
    <div class="card">
      <h2 style="font-size:16px; color:#f39c12; margin-bottom:10px;">✨ 添加任务</h2>
      <div class="input-group">
        <input type="text" id="todo-input" placeholder="输入新任务..." onkeydown="if(event.key==='Enter') addTodo()">
        <button class="btn btn-primary" onclick="addTodo()">添加</button>
      </div>
    </div>

    <!-- 统计 -->
    <div class="card">
      <div class="stats">
        <div><div class="num" id="total-count">0</div><div class="label">总计</div></div>
        <div><div class="num" id="done-count" style="color:#2ecc71;">0</div><div class="label">已完成</div></div>
        <div><div class="num" id="pending-count" style="color:#f39c12;">0</div><div class="label">待完成</div></div>
      </div>
    </div>

    <!-- 列表 -->
    <div class="card">
      <h2 style="font-size:16px; color:#f39c12; margin-bottom:10px;">📌 任务列表</h2>
      <ul id="todo-list">
        <div class="loading">⏳ 加载中...</div>
      </ul>
    </div>

    <!-- API 说明 -->
    <div class="card">
      <h2 style="font-size:16px; color:#f39c12; margin-bottom:10px;">📡 API 接口</h2>
      <div class="api-info">
        GET    /api/todos     → 获取列表<br>
        POST   /api/todos     → 创建任务<br>
        PUT    /api/todos/:id → 更新任务<br>
        DELETE /api/todos/:id → 删除任务
      </div>
    </div>
  </div>

  <script>
    // ====== API 地址 ======
    // 如果后端换了端口，改这里就行
    const API = "http://localhost:3000/api";

    // ====== 检查连接 ======
    async function checkConnection() {
      try {
        const res = await fetch(`${API}/health`);
        const data = await res.json();
        if (data.status === "ok") {
          document.getElementById("status-dot").className = "status-dot connected";
          document.getElementById("status-text").textContent =
            `✅ 已连接 (${data.time.slice(0, 19).replace("T", " ")})`;
          return true;
        }
      } catch {
        // 连接失败
      }
      document.getElementById("status-dot").className = "status-dot disconnected";
      document.getElementById("status-text").textContent = "❌ 无法连接服务器，请确认后端已启动";
      return false;
    }

    // ====== 获取所有待办 ======
    async function fetchTodos() {
      try {
        const res = await fetch(`${API}/todos`);
        const result = await res.json();
        return result.data || [];
      } catch (err) {
        console.error("获取失败:", err);
        return [];
      }
    }

    // ====== 渲染列表 ======
    async function render() {
      const todos = await fetchTodos();
      const list = document.getElementById("todo-list");

      if (todos.length === 0) {
        list.innerHTML = '<li style="text-align:center; padding:20px; color:#888;">暂无任务 🎉</li>';
      } else {
        list.innerHTML = todos.map(todo => `
          <li class="todo-item ${todo.done ? "done" : ""}">
            <input type="checkbox" class="todo-check"
                   ${todo.done ? "checked" : ""}
                   onchange="toggleTodo(${todo.id}, this.checked)">
            <span class="todo-text">${todo.title}</span>
            <button class="btn btn-danger" onclick="deleteTodo(${todo.id})">删除</button>
          </li>
        `).join("");
      }

      // 更新统计
      const done = todos.filter(t => t.done).length;
      document.getElementById("total-count").textContent = todos.length;
      document.getElementById("done-count").textContent = done;
      document.getElementById("pending-count").textContent = todos.length - done;
    }

    // ====== 添加待办 ======
    async function addTodo() {
      const input = document.getElementById("todo-input");
      const title = input.value.trim();
      if (!title) {
        alert("请输入任务内容！");
        return;
      }

      try {
        const res = await fetch(`${API}/todos`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title })
        });

        if (res.ok) {
          input.value = "";
          await render();
        } else {
          const err = await res.json();
          alert("添加失败：" + err.message);
        }
      } catch (err) {
        alert("网络错误：" + err.message);
      }
    }

    // ====== 切换完成状态 ======
    async function toggleTodo(id, done) {
      try {
        await fetch(`${API}/todos/${id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ done })
        });
        await render();
      } catch (err) {
        console.error("更新失败:", err);
      }
    }

    // ====== 删除待办 ======
    async function deleteTodo(id) {
      try {
        await fetch(`${API}/todos/${id}`, { method: "DELETE" });
        await render();
      } catch (err) {
        console.error("删除失败:", err);
      }
    }

    // ====== 初始化 ======
    async function init() {
      const connected = await checkConnection();
      if (connected) {
        await render();
      }
    }

    init();
  </script>
</body>
</html>
